name: Publish staging preview

on:
  push:
    branches:
      - codex-staging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-staging-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: production

      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: codex-staging
          fetch-depth: 1
          path: staging-source

      - name: Build public-by-link staging preview
        shell: bash
        run: |
          set -euo pipefail

          rm -rf production/staging
          mkdir -p production/staging

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='staging/' \
            staging-source/ production/staging/

          python3 - <<'PY'
          from pathlib import Path

          preview_root = Path('production/staging')
          marker = 'data-lloamc-staging-banner="true"'
          meta = '<meta name="robots" content="noindex, nofollow, noarchive">'
          style = '''
          <style id="lloamc-staging-style">
            html { scroll-padding-top: 52px; }
            body { padding-top: 52px !important; }
            #lloamc-staging-banner {
              position: fixed;
              inset: 0 0 auto 0;
              z-index: 2147483647;
              min-height: 52px;
              display: flex;
              align-items: center;
              justify-content: center;
              padding: 0.65rem 1rem;
              background: linear-gradient(90deg, #ffbf00, #ff7a00);
              border-bottom: 3px solid #111;
              color: #111;
              font: 800 14px/1.25 Arial, sans-serif;
              letter-spacing: 0.04em;
              text-align: center;
              box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            }
            @media (max-width: 640px) {
              body { padding-top: 64px !important; }
              #lloamc-staging-banner {
                min-height: 64px;
                font-size: 12px;
              }
            }
          </style>
          '''
          banner = '''
          <div id="lloamc-staging-banner" data-lloamc-staging-banner="true" role="status">
            <span>STAGING PREVIEW — NOT THE LIVE AUTHOR SITE</span>
          </div>
          '''

          for page in preview_root.rglob('*.html'):
              text = page.read_text(encoding='utf-8', errors='replace')

              if meta not in text:
                  if '</head>' in text:
                      text = text.replace('</head>', f'    {meta}\n{style}\n</head>', 1)
                  else:
                      text = f'{meta}\n{style}\n{text}'

              if marker not in text:
                  if '<body>' in text:
                      text = text.replace('<body>', f'<body>\n{banner}', 1)
                  elif '<body ' in text:
                      body_end = text.find('>', text.find('<body '))
                      if body_end != -1:
                          text = text[:body_end + 1] + '\n' + banner + text[body_end + 1:]

              page.write_text(text, encoding='utf-8')

          # The MC control is an owner convenience, not the security boundary.
          # It appears only after a one-time browser activation; Cloudflare Access
          # still protects the destination even if someone discovers the URL.
          home = preview_root / 'index.html'
          if home.exists():
              text = home.read_text(encoding='utf-8', errors='replace')
              mc_marker = 'data-lloamc-private-mc="true"'
              mc_style = '''
              <style id="lloamc-private-mc-style">
                #lloamc-private-mc {
                  position: fixed;
                  left: 1.25rem;
                  bottom: 1.25rem;
                  z-index: 21;
                  width: 42px;
                  height: 42px;
                  display: none;
                  align-items: center;
                  justify-content: center;
                  border: 1px solid rgba(36, 246, 255, 0.5);
                  border-radius: 50%;
                  background: rgba(5, 7, 20, 0.78);
                  color: #24f6ff;
                  font: 800 11px/1 'Orbitron', Arial, sans-serif;
                  letter-spacing: 0.08em;
                  text-decoration: none;
                  opacity: 0.18;
                  box-shadow: 0 0 10px rgba(36, 246, 255, 0.18);
                  transition: opacity 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
                }
                #lloamc-private-mc[data-enabled="true"] { display: flex; }
                #lloamc-private-mc:hover,
                #lloamc-private-mc:focus-visible {
                  opacity: 0.9;
                  transform: translateY(-2px) scale(1.04);
                  box-shadow: 0 0 18px rgba(36, 246, 255, 0.55);
                  outline: 2px solid #24f6ff;
                  outline-offset: 2px;
                }
              </style>
              '''
              mc_html = '''
              <a id="lloamc-private-mc" data-lloamc-private-mc="true" href="https://codex-staging.lloamc-mission-control.pages.dev/" target="_blank" rel="noopener noreferrer" aria-label="Open private Mission Control">MC</a>
              <script id="lloamc-private-mc-script">
              (() => {
                const key = 'lloamc-private-mc-enabled';
                const url = new URL(window.location.href);
                if (url.searchParams.get('enableMC') === '1') {
                  localStorage.setItem(key, '1');
                  url.searchParams.delete('enableMC');
                  history.replaceState({}, '', url.pathname + (url.search ? url.search : '') + url.hash);
                }
                if (url.searchParams.get('disableMC') === '1') {
                  localStorage.removeItem(key);
                  url.searchParams.delete('disableMC');
                  history.replaceState({}, '', url.pathname + (url.search ? url.search : '') + url.hash);
                }
                const link = document.getElementById('lloamc-private-mc');
                if (link && localStorage.getItem(key) === '1') link.dataset.enabled = 'true';
              })();
              </script>
              '''

              if mc_marker not in text:
                  text = text.replace('</head>', f'{mc_style}\n</head>', 1)
                  text = text.replace('</body>', f'{mc_html}\n</body>', 1)
                  home.write_text(text, encoding='utf-8')
          PY

          cat > production/staging/STAGING-INFO.txt <<'EOF'
          This folder is generated automatically from the codex-staging branch.
          Do not edit these generated files directly on main.
          Production remains at the repository root.
          EOF

      - name: Commit preview to production branch
        shell: bash
        working-directory: production
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging

          if git diff --cached --quiet; then
            echo "Staging preview is already current."
            exit 0
          fi

          git commit -m "chore: publish staging preview"
          git push origin main
