name: Update Joshua Grid Duel

on:
  push:
    branches:
      - codex-staging
    paths:
      - .github/workflows/update-joshua-grid-duel.yml

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: codex-staging
          fetch-depth: 0

      - name: Blend WarGames concept with Grid visuals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          home = index.read_text(encoding='utf-8')
          old_caption = '<div class="button-desc">Get derezzed by the MCP. Review on Amazon.</div>'
          new_caption = '<div class="button-desc">Lose to Joshua. Review on Amazon.</div>'
          if old_caption not in home:
              raise SystemExit('Expected staging homepage caption not found')
          index.write_text(home.replace(old_caption, new_caption, 1), encoding='utf-8')

          game_path = Path('tictactoe.html')
          game = game_path.read_text(encoding='utf-8')

          replacements = {
              '<title>Grid Duel: Tic-Tac-Toe</title>': '<title>Joshua\'s Grid Duel: Tic-Tac-Toe</title>',
              'content="Enter an animated neon-grid Tic-Tac-Toe duel against the MCP. Survive the system and claim your reward."': 'content="Challenge Joshua, the WOPR intelligence operating through an MCP-style Grid shell, in animated neon Tic-Tac-Toe."',
              '<meta property="og:title" content="Grid Duel: Tic-Tac-Toe">': '<meta property="og:title" content="Joshua\'s Grid Duel: Tic-Tac-Toe">',
              'content="An original 1980s digital-grid arcade duel from the world of Life Lessons of a Man-Child."': 'content="A WarGames-meets-digital-Grid arcade duel from the world of Life Lessons of a Man-Child."',
              '<p class="eyebrow">LLoaMC Arcade Program // Sector 82</p>': '<p class="eyebrow">WOPR Simulation Link // Sector 82</p>',
              '<p class="subtitle">Tic-Tac-Toe against the MCP</p>': '<p class="subtitle">Tic-Tac-Toe against Joshua</p>\n        <div class="wopr-link" role="status"><span class="wopr-dot" aria-hidden="true"></span>WOPR ONLINE <span>//</span> JOSHUA <span>//</span> MCP GRID SHELL</div>',
              '<span>GRID INTEGRITY</span>': '<span>GRID SIMULATION INTEGRITY</span>',
              '<p class="system-note">MCP countermeasures adapt after every completed grid. Persistence may reveal an anomaly.</p>': '<p class="system-note">Joshua\'s MCP countermeasures adapt after every completed grid. Persistence may reveal the flaw in the simulation.</p>',
              '<p class="combatant-label">MASTER CONTROL PROGRAM</p>\n            <h2>MCP</h2>\n            <p>Perfect strategy. Relentless countermeasures. No known mercy protocol.</p>': '<p class="combatant-label">WOPR GAME PROGRAM // MCP SHELL</p>\n            <h2>JOSHUA</h2>\n            <p>Perfect game strategy operating through a relentless Master Control Program shell.</p>',
              '<p class="gate-code">SYSTEM HANDSHAKE // ORIGINAL GRID SCORE ENABLED</p>': '<p class="gate-code">WOPR LINK ESTABLISHED // MCP GRID SHELL ONLINE</p>',
              '<h2 id="gate-title">ENTER THE GRID</h2>': '<h2 id="gate-title">SHALL WE PLAY A GAME?</h2>',
              '<p>You are the DISC program. The MCP controls the arena. The soundtrack and effects are an original synth composition generated inside your browser.</p>': '<p>You are the DISC program. Joshua is the WOPR intelligence controlling this arena through an MCP-style Grid shell. The soundtrack and effects are an original synth composition generated inside your browser.</p>',
              "const AI = 'MCP';": "const AI = 'JOSHUA';",
              "statusEl.textContent = 'SYSTEM ANOMALY DETECTED. MCP response matrix destabilizing.';": "statusEl.textContent = 'SYSTEM ANOMALY DETECTED. Joshua response matrix destabilizing.';",
              ": 'Your move, DISC. MCP countermeasures are active.';": ": 'Your move, DISC. Joshua\'s MCP countermeasures are active.';",
              "resultTitle.textContent = 'MCP DEFEATED';": "resultTitle.textContent = 'JOSHUA CONCEDES';",
              "resultCopy.textContent = 'You found the flaw in the system. Your prize is a passage out of the Grid and into one of the greatest computer-game movies of the 1980s.';": "resultCopy.textContent = 'You found the flaw in Joshua\'s simulation. Your prize is a passage out of the Grid and into one of the greatest computer-game movies of the 1980s.';",
              "resultCode.textContent = 'PROGRAM DEREZZED // MCP VICTORIOUS';": "resultCode.textContent = 'PROGRAM DEREZZED // JOSHUA VICTORIOUS';",
              "resultTitle.textContent = 'END OF LINE';": "resultTitle.textContent = 'JOSHUA WINS';",
              "resultCopy.textContent = 'The MCP has terminated your program. Regroup with Life Lessons of a Man-Child before attempting another breach.';": "resultCopy.textContent = 'Joshua\'s MCP shell has terminated your program. Regroup with Life Lessons of a Man-Child before attempting another simulation.';",
              "updateStatus(percent <= 0 ? 'DRAW. Grid integrity collapsed. MCP vulnerability exposed.' : `DRAW. Grid integrity reduced to ${percent}%. Reinitializing…`);": "updateStatus(percent <= 0 ? 'DRAW. Grid integrity collapsed. Joshua vulnerability exposed.' : `DRAW. Grid integrity reduced to ${percent}%. Reinitializing…`);",
              "updateStatus(result.outcome === HUMAN ? 'Impossible result: user program has breached the MCP.' : 'MCP victory. User program derezzed.');": "updateStatus(result.outcome === HUMAN ? 'Joshua has recognized the flaw in the simulation.' : 'Joshua victory. User program derezzed.');",
              "updateStatus('MCP calculating countermeasure…');": "updateStatus('Joshua calculating MCP countermeasure…');"
          }

          for old, new in replacements.items():
              if old not in game:
                  raise SystemExit(f'Expected game text not found: {old[:90]}')
              game = game.replace(old, new, 1)

          style_marker = '    @media (max-width: 900px) {'
          wopr_style = '''
    .wopr-link {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 13px;
      padding: 8px 11px;
      border: 1px solid rgba(124,255,155,.34);
      border-radius: 7px;
      color: #7cff9b;
      background: rgba(2, 18, 13, .7);
      box-shadow: inset 0 0 14px rgba(124,255,155,.05), 0 0 14px rgba(124,255,155,.06);
      font: 700 clamp(.52rem, 1.35vw, .66rem)/1.45 'Roboto Mono', monospace;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .wopr-link span:not(.wopr-dot) { color: rgba(124,255,155,.48); }
    .wopr-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #7cff9b;
      box-shadow: 0 0 12px #7cff9b;
      animation: pulseGlow 1.35s ease-in-out infinite;
    }

'''
          if style_marker not in game:
              raise SystemExit('Responsive style marker not found')
          game = game.replace(style_marker, wopr_style + style_marker, 1)

          game_path.write_text(game, encoding='utf-8')
          PY

      - name: Commit revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tictactoe.html
          git commit -m "feat: recast Grid Duel around Joshua and WOPR"
          git push origin codex-staging
