name: Apply podcast staging banner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-podcast-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-staging-home:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Podcasts banner to staging homepage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('staging/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'data-podcast-stage-banner="true"'
          if marker in text:
              print('Podcast banner already present; nothing to change.')
              raise SystemExit(0)

          anchor = '            <div class="nav-buttons">'
          if anchor not in text:
              raise SystemExit('Could not find the staging navigation grid anchor.')

          banner = '''            <!-- Full-width Podcasts banner -->
            <div data-podcast-stage-banner="true" style="width:100%;max-width:1000px;margin:0 auto 2rem;">
                <a href="podcasts.html" class="arcade-button" style="width:100%;display:block;padding:1.5rem 1rem;">
                    <span class="button-icon">🎙️</span>
                    <div class="button-title" style="font-size:0.9rem;letter-spacing:0.12em;">PODCASTS</div>
                    <div class="button-desc">Conversations inspired by the memoir</div>
                </a>
            </div>

'''
          text = text.replace(anchor, banner + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit staging-only update
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/index.html
          git commit -m "feat: add Podcasts banner to staging homepage"
          git push origin main

# Triggered after initial workflow installation.
