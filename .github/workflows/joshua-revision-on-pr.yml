name: Joshua Grid Duel one-time revision

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/joshua-trigger.txt

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: production

      - name: Check out staging source
        uses: actions/checkout@v4
        with:
          ref: codex-staging
          fetch-depth: 0
          path: staging-source

      - name: Apply source revision
        shell: bash
        run: |
          set -euo pipefail
          python3 production/.github/scripts/joshua_grid_revision.py staging-source

          cd staging-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tictactoe.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: recast Grid Duel around Joshua and WOPR"
            git push origin codex-staging
          fi

      - name: Publish revised staging preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf production/staging
          mkdir -p production/staging
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='staging/' staging-source/ production/staging/

          python3 - <<'PY'
          from pathlib import Path
          root = Path('production/staging')
          marker = 'data-lloamc-staging-banner="true"'
          meta = '<meta name="robots" content="noindex, nofollow, noarchive">'
          style = '''
          <style id="lloamc-staging-style">
            html { scroll-padding-top: 52px; }
            body { padding-top: 52px !important; }
            #lloamc-staging-banner { position: fixed; inset: 0 0 auto 0; z-index: 2147483647; min-height: 52px; display: flex; align-items: center; justify-content: center; padding: .65rem 1rem; background: linear-gradient(90deg,#ffbf00,#ff7a00); border-bottom: 3px solid #111; color:#111; font:800 14px/1.25 Arial,sans-serif; letter-spacing:.04em; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,.35); }
            @media(max-width:640px){ body{padding-top:64px!important} #lloamc-staging-banner{min-height:64px;font-size:12px} }
          </style>
          '''
          banner = '''<div id="lloamc-staging-banner" data-lloamc-staging-banner="true" role="status"><span>STAGING PREVIEW — NOT THE LIVE AUTHOR SITE</span></div>'''
          for page in root.rglob('*.html'):
              text = page.read_text(encoding='utf-8', errors='replace')
              if meta not in text:
                  text = text.replace('</head>', f'    {meta}\n{style}\n</head>', 1)
              if marker not in text:
                  if '<body>' in text:
                      text = text.replace('<body>', f'<body>\n{banner}', 1)
                  elif '<body ' in text:
                      end = text.find('>', text.find('<body '))
                      text = text[:end+1] + '\n' + banner + text[end+1:]
              page.write_text(text, encoding='utf-8')
          (root / 'STAGING-INFO.txt').write_text('Generated from codex-staging. Production remains at repository root.\n', encoding='utf-8')
          PY

          cd production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Joshua Grid Duel staging preview"
            git push origin main
          fi
