name: Finalize podcast staging audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-podcast-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-podcast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary excerpt fallback and note
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('staging/podcasts.html')
          text = path.read_text(encoding='utf-8')
          original = text
          text = re.sub(r'\n\s*<source src="data:audio/ogg;base64,[^"]+" type="audio/ogg; codecs=opus">', '', text)
          text = re.sub(r'\n\s*<p class="stage-media-note">.*?</p>', '', text)
          if text == original:
              print('No temporary audio fallback or note remained.')
          else:
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit staging cleanup
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/podcasts.html
          git commit -m "chore: finalize full podcast audio in staging"
          git push origin main
