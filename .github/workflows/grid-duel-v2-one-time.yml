name: Grid Duel cinematic audio and approach update

on:
  pull_request:
    branches:
      - main
    paths:
      - grid-duel-v2-trigger.txt

permissions:
  contents: write

jobs:
  patch-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools-main

      - name: Check out author-site staging
        uses: actions/checkout@v4
        with:
          ref: codex-staging
          fetch-depth: 0
          path: site

      - name: Normalize one strict patch marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools-main/tools/patch-grid-duel-v2.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"        master.gain.setTargetAtTime(enabled ? 0.28 : 0, system.context.currentTime, 0.035);"',
              '"          system.master.gain.setTargetAtTime(enabled ? 0.28 : 0, system.context.currentTime, 0.035);"'
          )
          text = text.replace(
              '"        master.gain.setTargetAtTime(enabled ? 0.58 : 0, system.context.currentTime, 0.035);"',
              '"          system.master.gain.setTargetAtTime(enabled ? 0.58 : 0, system.context.currentTime, 0.035);"'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply cinematic Grid Duel patch
        run: python3 tools-main/tools/patch-grid-duel-v2.py site

      - name: Commit staging update
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tictactoe.html
          git commit -m "feat: intensify Grid Duel audio and cinematic approach"
          git push origin codex-staging
