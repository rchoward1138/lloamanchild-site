name: Grid Duel cinematic audio and approach update

on:
  pull_request:
    branches:
      - main
    paths:
      - grid-duel-v2-trigger.txt

permissions:
  contents: write

jobs:
  patch-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main tools and public staging copy
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: tools-main

      - name: Check out author-site staging source
        uses: actions/checkout@v4
        with:
          ref: codex-staging
          fetch-depth: 0
          path: site

      - name: Normalize one strict patch marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools-main/tools/patch-grid-duel-v2.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"        master.gain.setTargetAtTime(enabled ? 0.28 : 0, system.context.currentTime, 0.035);"',
              '"          system.master.gain.setTargetAtTime(enabled ? 0.28 : 0, system.context.currentTime, 0.035);"'
          )
          text = text.replace(
              '"        master.gain.setTargetAtTime(enabled ? 0.58 : 0, system.context.currentTime, 0.035);"',
              '"          system.master.gain.setTargetAtTime(enabled ? 0.58 : 0, system.context.currentTime, 0.035);"'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply cinematic patch where needed
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "tempestApproach" site/tictactoe.html; then
            python3 tools-main/tools/patch-grid-duel-v2.py site
          fi
          if ! grep -q "tempestApproach" tools-main/staging/tictactoe.html; then
            python3 tools-main/tools/patch-grid-duel-v2.py tools-main/staging
          fi

      - name: Commit staging source update when changed
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tictactoe.html
          if git diff --cached --quiet; then
            echo "Staging source already current."
          else
            git commit -m "feat: intensify Grid Duel audio and cinematic approach"
            git push origin codex-staging
          fi

      - name: Commit public-by-link staging copy when changed
        working-directory: tools-main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/tictactoe.html
          if git diff --cached --quiet; then
            echo "Public staging copy already current."
          else
            git commit -m "chore: publish cinematic Grid Duel staging preview"
            git push origin main
          fi
