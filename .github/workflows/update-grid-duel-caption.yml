name: Update Grid Duel homepage caption

on:
  push:
    branches:
      - codex-staging
    paths:
      - .github/workflows/update-grid-duel-caption.yml

permissions:
  contents: write

jobs:
  update-caption:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: codex-staging

      - name: Replace Joshua caption with MCP caption
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'Lose to Joshua, Review on Amazon'
          new = 'Get derezzed by the MCP. Review on Amazon.'

          if old not in text:
              raise SystemExit('Expected homepage caption was not found.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit homepage caption
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "copy: rename Joshua to MCP on homepage"
          git push origin codex-staging
